    <header>
        <div class="box">
            <h2>Contact</h2>
        <h3><strong>Vous pouvez me contacter facilement via ce formulaire</strong></h3>
            <form action="https://formspree.io/f/mlgwpbbw" method="POST">
            <div class="form-group">
                <label for="name" class="form-label">Votre nom*</label>
                <input type="text" name="name" id="name" class="form-input" required/>
            </div>
            <div class="form-group">
                <label for="email" class="form-label">Adresse email*</label>
                <input type="email" name="email" id="email" class="form-input" required/>
            </div>
            <div class="form-group">
                <label for="company" class="form-label">Nom de l'école/entreprise (Optionnel)</label>
                <input type="text" name="company" id="company" class="form-input"/>
            </div>
            <div class="form-group">
                <label for="message" class="form-label">Message (Optionnel)</label>
                <textarea name="message" id="message" rows="4" class="form-textarea"></textarea>
            </div>
            <div class="consent-group">
                <input type="checkbox" id="consent" class="form-checkbox" required/>
                <label for="consent" class="consent-label">
                    <strong>Attention, le mail sera envoyé grâce à formspree, si vous souhaitez en savoir plus, leurs conditions d'utilisation se trouvent en dessous</strong>
                </label>
            </div>
            <div class="privacy-links">
                <a href="https://formspree.io/legal/terms-of-service/">Conditions d'utilisation de Formspree</a>
            </div>
            <div>
            <button type="submit" class="submit-btn">Envoyer</button>
            </div>
            </form>
    </header>
